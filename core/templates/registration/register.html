{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Składanie podania</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

    <div class="wrapper">
        <div class="wrapper-form register-form">
            <img src="{% static 'core/images/logo.png' %}" alt="Logo" class="logo-img">
            <h2>Złóż swoje podanie</h2>
            <p class="subtitle">Złóż swoją kandydature na studia</p>
            <form method="POST">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}
                <button class="btn" type="submit">Wyślij podanie</button>
            </form>
        </div>
    </div>

</body>
</html>
