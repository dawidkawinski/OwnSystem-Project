{% load static %}
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel studenta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>

<body>
    <div class="content">
        <div class="left-panel">
            <img src="{% static 'core/images/logo.png' %}" alt="Logo" class="logo-img">

            <nav class="sidebar-nav">
                <a href="{% url 'student_master' %}" class="nav-item {% if request.resolver_match.url_name == 'student_master' %}active{% endif %}">
                    <i class="bi bi-house"></i>
                    <span>Przegląd</span>
                </a>
                <a href="{% url 'student_courses' %}" class="nav-item {% if request.resolver_match.url_name == 'student_courses' %}active{% endif %}">
                    <i class="bi bi-book"></i>
                    <span>Moje Przedmioty</span>
                </a>
                <a href="{% url 'student_grades' %}" class="nav-item {% if request.resolver_match.url_name == 'student_grades' %}active{% endif %}">
                    <i class="bi bi-award"></i>
                    <span>Oceny</span>
                </a>
                <a href="{% url 'student_messages' %}" class="nav-item {% if request.resolver_match.url_name == 'student_messages' %}active{% endif %}">
                    <i class="bi bi-envelope"></i>
                    <span>Wiadomości</span>
                </a>
            </nav>

            {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="logout-btn">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Wyloguj</span>
                </button>
            </form>
            {% endif %}
        </div>

        <div class="right-panel">
            <header>
                <h2>Witaj, {{ user.first_name }} {{ user.last_name }}</h2>
            </header>

            {% block content %}{% endblock %}

        </div>
        
    </div>
</body>

</html>
